<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="panel-card">
    <!-- CABEÇALHO DA PÁGINA -->
    <div class="panel-header">
        <h1>Painel de Controle de Estoque</h1>
    </div>

    <!-- BARRA DE AÇÕES HORIZONTAL (EXATO COMO EXEMPLO.PNG) -->
    <div class="action-bar">
        <a href="novo-veiculo.html" class="btn-action">Novo Veículo</a>
        <a href="marcas-modelos.html" class="btn-action">Gerir Marcas & Modelos</a>
        <button class="btn-action" onclick="toggleFiltros()">Filtrar Estoque</button>
        <button class="btn-danger-action" onclick="location.reload()">Atualizar Página</button>
    </div>

    <!-- PAINEL DE FILTROS COMPLETO (REQUISITOS.TXT) -->
    <div id="painelFiltros" style="display: none; background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 24px; border: 1px solid #e2e8f0;">
        <h3 style="font-size: 0.95rem; margin-bottom: 14px; color: #334155;">🔍 Filtros de Busca Avançados</h3>

        <div class="form-grid">
            <div class="form-group">
                <label>Marca</label>
                <select id="filtroMarca" class="form-select" onchange="atualizarModelosFiltro()"></select>
            </div>

            <div class="form-group">
                <label>Modelo</label>
                <select id="filtroModelo" class="form-select"></select>
            </div>

            <div class="form-group">
                <label>Ano de Fabricação</label>
                <input type="number" id="filtroAno" class="form-control" placeholder="Ex: 2022">
            </div>

            <div class="form-group">
                <label>Preço Mínimo (R$)</label>
                <input type="number" step="0.01" id="filtroPrecoMin" class="form-control" placeholder="Ex: 50000">
            </div>

            <div class="form-group">
                <label>Preço Máximo (R$)</label>
                <input type="number" step="0.01" id="filtroPrecoMax" class="form-control" placeholder="Ex: 120000">
            </div>

            <div class="form-group">
                <label>Status de Disponibilidade</label>
                <select id="filtroStatus" class="form-select">
                    <option value="">Todos os Status</option>
                    <option value="DISPONIVEL">DISPONÍVEL</option>
                    <option value="RESERVADO">RESERVADO</option>
                    <option value="VENDIDO">VENDIDO</option>
                    <option value="DESCONTINUADO">DESCONTINUADO</option>
                </select>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end;">
            <button class="btn-action" style="flex: initial; padding: 10px 24px;" onclick="aplicarFiltros()">Filtrar Veículos</button>
            <button class="btn-sm-delete" style="padding: 10px 18px;" onclick="limparFiltros()">Limpar Filtros</button>
        </div>
    </div>

    <!-- TABELA ESTOQUE ATUAL -->
    <h2 class="section-title">Estoque Atual</h2>

    <table class="custom-table">
        <thead>
        <tr>
            <th>Veículo</th>
            <th>Marca</th>
            <th>Ano / Cor</th>
            <th>Preço</th>
            <th>KM</th>
            <th>Status</th>
            <th style="text-align: center;">Ações</th>
        </tr>
        </thead>
        <tbody id="tabelaEstoque">
        <tr>
            <td colspan="7" style="text-align: center; color: #94a3b8;">A carregar estoque...</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        carregarEstoque();
        carregarMarcasFiltro();
    });
</script>
</body>
</html>
